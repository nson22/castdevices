name: Release

# - Push de tag v* (a partir da main): builda Windows, macOS e Linux, roda o
#   smoke test em cada um e publica tudo no release da tag.
# - Manual (Actions -> Release -> Run workflow): sem tag, só builda e testa
#   (pacotes ficam como artifacts da execução); com tag, publica nela.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag para publicar (vazio = só build/teste, sem release)"
        required: false
        default: ""

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            suffix: win64.zip
          - platform: macos
            os: macos-latest  # Apple Silicon (arm64)
            suffix: macos-arm64.dmg
          - platform: linux
            os: ubuntu-22.04  # glibc mais antiga = roda em mais distros
            suffix: linux-x86_64.tar.gz
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG != '' && env.TAG || github.ref }}

      - name: Nome do pacote
        run: |
          VERSION="${TAG:-dev-${GITHUB_SHA::7}}"
          echo "PACKAGE=scrcpy-ui-${VERSION}-${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v6

      - name: Libs do sistema (Qt offscreen + áudio, pro smoke test)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0

      - name: Dependências
        run: uv sync --frozen

      - name: adb oficial (platform-tools fixado, como o scrcpy)
        run: uv run python packaging/fetch_adb.py

      - name: PyInstaller
        run: uv run pyinstaller scrcpy-ui.spec --noconfirm

      - name: Smoke test
        run: |
          case "${{ matrix.platform }}" in
            windows) EXE="dist/scrcpy-ui/scrcpy-ui.exe" ;;
            macos)   EXE="dist/SCRCPY UI.app/Contents/MacOS/scrcpy-ui" ;;
            linux)   EXE="dist/scrcpy-ui/scrcpy-ui" ;;
          esac
          if [ "${{ matrix.platform }}" = "macos" ]; then ROOT="dist/SCRCPY UI.app"; else ROOT="dist/scrcpy-ui"; fi
          ADB_DIR="$(dirname "$(find "$ROOT" -path '*resources/platform-tools/VERSION' | head -n 1)")"
          echo "exe: $EXE | adb: $ADB_DIR"
          uv run python packaging/smoke_test.py "$EXE" "$ADB_DIR"

      # Licenças também na raiz do pacote (além de dentro do app), fáceis de achar
      - name: Licenças na raiz do pacote
        if: matrix.platform != 'macos'
        run: cp -R LICENSE NOTICE THIRD_PARTY_NOTICES.md LICENSES dist/scrcpy-ui/

      - name: Empacotar (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/scrcpy-ui -DestinationPath $env:PACKAGE

      - name: Empacotar (macOS)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dmg
          cp -R "dist/SCRCPY UI.app" dmg/
          cp -R LICENSE NOTICE THIRD_PARTY_NOTICES.md LICENSES dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "SCRCPY UI" -srcfolder dmg -ov -format UDZO "$PACKAGE"

      - name: Empacotar (Linux)
        if: matrix.platform == 'linux'
        run: |
          cp packaging/linux/scrcpy-ui.desktop packaging/linux/install.sh resources/icons/scrcpy-ui.png dist/scrcpy-ui/
          chmod +x dist/scrcpy-ui/install.sh dist/scrcpy-ui/scrcpy-ui
          tar -czf "$PACKAGE" -C dist scrcpy-ui

      - name: SHA-256
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "$PACKAGE"; else shasum -a 256 "$PACKAGE"; fi | tee "$PACKAGE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ env.PACKAGE }}
            ${{ env.PACKAGE }}.sha256
          if-no-files-found: error

  release:
    name: Publicar release
    needs: build
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || inputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Criar ou atualizar o release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la packages
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            NOTES="packaging/release-notes/$TAG.md"
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --title "SCRCPY UI $TAG" --notes-file "$NOTES" --latest
            else
              gh release create "$TAG" --title "SCRCPY UI $TAG" --generate-notes --latest
            fi
          fi
          gh release upload "$TAG" packages/* --clobber
