[project]
name = "castdevices"
version = "0.0.5a0"
description = "CastDevices: app desktop (PySide6/QML) para espelhar e controlar devices Android, compatível com o scrcpy-server"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
requires-python = ">=3.12"
dependencies = [
    "adbutils>=2.12.0",
    "av>=19.0.2",
    "numpy>=2.5.4",
    "pyside6>=6.12.0",
]

[project.scripts]
castdevices = "scrcpy_ui:main"
castdevices-dev = "scrcpy_ui.dev:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "watchfiles>=1.3.0",
]

[tool.uv.build-backend]
# O projeto se chama castdevices, mas o módulo Python continua scrcpy_ui
module-name = "scrcpy_ui"
