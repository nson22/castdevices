[project]
name = "scrcpy-ui"
version = "0.0.3a0"
description = "Cliente desktop (PySide6/QML) para espelhar e controlar devices Android, compatível com o scrcpy-server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adbutils>=2.12.0",
    "av>=19.0.2",
    "numpy>=2.5.4",
    "pyside6>=6.12.0",
]

[project.scripts]
scrcpy-ui = "scrcpy_ui:main"
scrcpy-ui-dev = "scrcpy_ui.dev:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "watchfiles>=1.3.0",
]
